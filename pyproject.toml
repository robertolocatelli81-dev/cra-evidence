[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-cra-evol"
version = "0.10.0"
description = "Firm-side, offline-verifiable evidence for the EU Cyber Resilience Act: SBOM records, the Art. 14 clock, SRP-aligned notices, a 10-year crypto-agile seal — in the cryptovalid ledger profile"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Roberto Locatelli"}]
keywords = ["cyber-resilience-act", "CRA", "SBOM", "CycloneDX", "vulnerability-reporting", "ENISA", "evidence", "audit", "hash-chain"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
               "Topic :: Security", "Intended Audience :: Developers", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=41"]

[project.scripts]
cra = "omega_cra_evol.cli:main"
omega-cra-evol = "omega_cra_evol.cli:main"

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev/omega-cra-evol"

[tool.setuptools]
packages = ["omega_cra_evol", "cra_evidence"]   # cra_evidence: the earlier import name, a deprecated alias (removed not before 2027-03-31)

[tool.setuptools.package-data]
omega_cra_evol = ["data/*.json"]
