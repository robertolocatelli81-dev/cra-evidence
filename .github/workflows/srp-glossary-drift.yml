name: srp-glossary-drift
# Weekly: re-extract the live ENISA CRA SRP glossary with scripts/srp_glossary.py and compare it with the newest
# snapshot in spec/sources/. Exit 1 (the job goes red) when the glossary differs, with the diff in the log;
# exit 2 when the page cannot be fetched or holds no glossary table. Read-only, no secrets.
on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the live glossary with the newest snapshot
        run: python3 scripts/srp_glossary.py check
