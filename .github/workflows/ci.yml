name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with signing extra) + the INDEPENDENT cryptovalid verifier for the interop test
        run: |
          pip install ".[sign]" jsonschema referencing
          pip install https://github.com/robertolocatelli81-dev/cryptovalid-opencore/releases/download/v0.15.0/cryptovalid_opencore-0.15.0-py3-none-any.whl
      - name: Unit tests (every suite; interop against cryptovalid runs because the wheel is installed)
        run: |
          for t in tests/test_*.py; do echo "== $t"; python "$t"; done
      - name: Gate — a tampered pack MUST fail, an intact one MUST pass (exit codes)
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, tempfile
          d = tempfile.mkdtemp(); led = os.path.join(d, "l.jsonl"); pack = os.path.join(d, "p.json")
          base = ["python", "-m", "cra_evidence.cli"]
          c = base + ["sbom", "--ledger", led, "--product", "p", "--version", "1", "--installed", "pip"]
          assert subprocess.run(c).returncode == 0
          assert subprocess.run(base + ["pack", "--ledger", led, "--product", "p", "--version", "1", "--out", pack]).returncode == 0
          assert subprocess.run(base + ["verify", pack]).returncode == 0, "intact pack must PASS"
          p = json.load(open(pack)); p["product_id"] = "x"; json.dump(p, open(pack, "w"))
          assert subprocess.run(base + ["verify", pack]).returncode != 0, "tampered pack must FAIL"
          print("gate ok")
          PY
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (whole history, pinned binary — the action fails on a root commit's parent)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks && ./gitleaks git . --redact --exit-code 1
  verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the independent verifiers (Go std-only; Rust with ed25519-dalek)
        run: |
          pip install ".[sign]"
          (cd verifiers/go && go vet ./... && go build -o /tmp/cra-verify-go .)
          (cd verifiers/rust && cargo build --release)
      - name: Differential oracle — Python / JS / Go / Rust must agree on every fixture AND on the failing layers (absence = failure)
        run: CRA_VERIFY_GO=/tmp/cra-verify-go python verifiers/differential.py --require js,go,rust
      - name: Official CycloneDX CLI — the four CycloneDX generator fixtures, and the 1.6 and 1.7 exports of every fixture and of the installed floor, must validate
        run: |
          curl -sSL -o /tmp/cyclonedx https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 && chmod +x /tmp/cyclonedx
          python - <<'PY'
          import glob, json, os, subprocess, sys
          sys.path.insert(0, ".")
          from cra_evidence.sbom import sbom_from_cyclonedx, sbom_from_installed, sbom_from_spdx
          recs = [(os.path.basename(p), (sbom_from_spdx if "spdx" in p else sbom_from_cyclonedx)(p, "tiny-cra-sample", "1.0.0")) for p in sorted(glob.glob("tests/fixtures/real_tools/*.json"))]
          recs.append(("installed", sbom_from_installed("cra-evidence", "0.3.0", ["cryptography"], transitive=True)))
          n = 0
          for p in sorted(glob.glob("tests/fixtures/real_tools/*cyclonedx*.json")):   # the generators' documents themselves
              v = json.load(open(p))["specVersion"]
              subprocess.run(["/tmp/cyclonedx", "validate", "--input-file", p, "--input-format", "json", "--input-version", "v" + v.replace(".", "_"), "--fail-on-errors"], check=True)
              n += 1
          for name, r in recs:
              for v in ("1.6", "1.7"):
                  out = f"/tmp/export_{v}_{name}"; json.dump(r.to_cyclonedx_min(v), open(out, "w"))
                  subprocess.run(["/tmp/cyclonedx", "validate", "--input-file", out, "--input-format", "json", "--input-version", "v" + v.replace(".", "_"), "--fail-on-errors"], check=True)
                  n += 1
          bad = json.load(open("/tmp/export_1.7_installed")); bad["components"][0]["type"] = "not-a-type"; json.dump(bad, open("/tmp/bad.json", "w"))
          assert subprocess.run(["/tmp/cyclonedx", "validate", "--input-file", "/tmp/bad.json", "--input-format", "json", "--input-version", "v1_7", "--fail-on-errors"]).returncode != 0, "positive control: the CLI must reject a broken document"
          print(f"cyclonedx-cli: {n} exports valid, positive control rejected")
          PY
      - name: Official SPDX tools (pyspdxtools) — the two SPDX generator fixtures must parse with no issue (its exit code is 0 even on an invalid document, so the output is the measure; positive control included)
        run: |
          pip install "spdx-tools==0.8.5"
          for f in tests/fixtures/real_tools/*spdx*.json; do out=$(pyspdxtools -i "$f" 2>&1); if [ -n "$out" ]; then echo "$f: $out"; exit 1; fi; echo "$f: no issue"; done
          echo '{"spdxVersion":"SPDX-2.3"}' > /tmp/bad.spdx.json
          if [ -z "$(pyspdxtools -i /tmp/bad.spdx.json 2>&1)" ]; then echo "positive control: pyspdxtools printed nothing on an invalid document"; exit 1; fi
          echo "pyspdxtools: fixtures clean, positive control reported"
