name: "cra-evidence"
description: "Run the cra command (EU Cyber Resilience Act evidence: SBOM record, Art. 14 clock, SRP notices, offline verification) from the provenance-verified container image"
author: "Roberto Locatelli"
branding:
  icon: "shield"
  color: "blue"

# Linux runners with docker (GitHub-hosted ubuntu-*). The image is pulled, its build provenance is verified for the
# pulled digest (`gh attestation verify`: built on a GitHub-hosted runner by .github/workflows/container.yml of this
# repository at the tag v<version>), and the cra command runs from that digest, as the runner's user, in the workspace.
# Arguments are split on whitespace (no shell).
# Usage:
#   - uses: robertolocatelli81-dev/cra-evidence@v0.9.0
#     with:
#       args: verify dist/pack.json --ledger evidence/cra.ledger.jsonl --trust-store evidence/trust.json

inputs:
  args:
    description: "Arguments of the cra command, e.g. `verify pack.json --ledger cra.ledger.jsonl`; split on whitespace"
    required: true
  version:
    description: "cra-evidence version of the image (default: the version of this action's release)"
    required: false
    default: "0.9.0"
  network:
    description: "Network of the container: `none` (default) or `bridge`, needed only by `cra feeds` and `cra sign --aws-kms-key-id` (the action passes no AWS_* variable to the container)"
    required: false
    default: "none"
  token:
    description: "Token used by `gh attestation verify` to read the attestation (read access to public data is enough)"
    required: false
    default: ${{ github.token }}
outputs:
  image:
    description: "The image that ran, by digest"
    value: ${{ steps.verify.outputs.image }}
  exit-code:
    description: "Exit code of `docker run`: that of the cra command, or 125-127 when docker itself fails (the step fails unless it is 0)"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        V: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: robertolocatelli81-dev/cra-evidence
      run: |
        set -euo pipefail
        case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::version '$V' is not X.Y.Z"; exit 1;; esac
        case "$V" in *[!0-9.]*) echo "::error::version '$V' is not X.Y.Z"; exit 1;; esac
        image="ghcr.io/$REPO"
        docker pull --quiet "$image:$V" > /dev/null
        # RepoDigests lists every repository the local image was pulled under, sorted: take the entry of this repository
        ref=""
        for r in $(docker inspect --format '{{range .RepoDigests}}{{.}} {{end}}' "$image:$V"); do
          case "$r" in "$image@"*) ref="$r"; break;; esac
        done
        digest="${ref#"$image@"}"
        case "$digest" in sha256:[0-9a-f]*) ;; *) echo "::error::no digest of $image for $image:$V"; exit 1;; esac
        case "$digest" in sha256:*[!0-9a-f]*) echo "::error::malformed digest '$digest'"; exit 1;; esac
        # exact signer identity: container.yml of this repository run for the tag v$V on a GitHub-hosted runner
        # (--signer-workflow alone is a prefix match and accepts any ref, e.g. a workflow_dispatch from a branch)
        gh attestation verify "oci://$image@$digest" --repo "$REPO" \
          --cert-identity "https://github.com/$REPO/.github/workflows/container.yml@refs/tags/v$V" \
          --source-ref "refs/tags/v$V" --deny-self-hosted-runners > /dev/null
        echo "provenance verified: $image@$digest (built by $REPO/.github/workflows/container.yml at refs/tags/v$V)"
        echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
    - id: run
      shell: bash
      env:
        IMAGE: ${{ steps.verify.outputs.image }}
        CRA_ARGS: ${{ inputs.args }}
        NET: ${{ inputs.network }}
      run: |
        set -uo pipefail
        set -f
        case "$NET" in none|bridge) ;; *) echo "::error::network '$NET' is neither none nor bridge"; exit 1;; esac
        argv=()
        read -r -d '' -a argv <<< "$CRA_ARGS" || true
        [ "${#argv[@]}" -gt 0 ] || { echo "::error::args is empty"; exit 1; }
        rc=0
        docker run --rm --network "$NET" --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" "${argv[@]}" || rc=$?
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        exit "$rc"
